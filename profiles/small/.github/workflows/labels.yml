# .github/workflows/labels.yml — <PROJECT> (modo chico)
# Aplica .github/labels.yml al repo (borra los labels que no estén en el archivo).
name: Labels

on:
  push:
    branches: [<BASE_BRANCH>]
    paths: ['.github/labels.yml']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
