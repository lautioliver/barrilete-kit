# .github/labels.yml — <PROJECT> (small mode)
# Source of truth for the labels. See docs/github-naming-convention.md.
- name: "type:feature"
  color: "7B61FF"
  description: "New functionality or a visible change"
  aliases:
    - "tipo:feature"
- name: "type:bug"
  color: "7B61FF"
  description: "Something does not work as it should"
  aliases:
    - "tipo:bug"
- name: "type:task"
  color: "7B61FF"
  description: "Technical work with no visible change"
  aliases:
    - "tipo:task"
- name: "type:docs"
  color: "7B61FF"
  description: "Documentation"
  aliases:
    - "tipo:docs"
- name: "priority:high"
  color: "D93F0B"
  description: "Goes first"
  aliases:
    - "prioridad:alta"
- name: "priority:medium"
  color: "FBCA04"
  description: "Important, not urgent"
  aliases:
    - "prioridad:media"
- name: "priority:low"
  color: "C5C5C5"
  description: "When there is time"
  aliases:
    - "prioridad:baja"
