# .github/workflows/labels.yml — <PROJECT>
# 1) sync:    applies .github/labels.yml to the repo (deletes labels that are not in the file;
#             `aliases` rename the old labels and keep the ones already set on issues).
# 2) labeler: labels PRs according to branch and files (.github/labeler.yml).
# 3) check:   validates the PR labels against docs/github-naming-convention.md §5 and, on agent
#             branches (claude/…), that the body closes or references an issue (Refs #n, for a PR
#             that does not close it, like a diagnosis) and shows the red of the tests.
name: Labels

on:
  push:
    # main: for the template itself. The init leaves it as [<BASE_BRANCH>].
    branches: [main, <BASE_BRANCH>]
    paths: ['.github/labels.yml']
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

jobs:
  sync:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true   # deletes bug, enhancement, etc. (convention §5)

  labeler:
    if: github.event_name == 'pull_request_target' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # It does not check out the PR code: safe with pull_request_target.
      # The config is read from the base branch, so changes to labeler.yml apply after the merge.
      - uses: actions/labeler@v5
        with:
          sync-labels: false   # does not remove labels set by hand (type:audit, business-logic, etc.)
      # Agent branches (claude/…) do not say the type: it is copied from the issue the PR closes.
      # It came out of /improve-skills in a real repo: agent branches arrived without a type and the check failed.
      - name: Copy type and area from the issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: actual } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo, issue_number: pr.number,
            });
            const tiene = p => actual.some(l => l.name.startsWith(p));
            if (tiene('type:')) return core.info('The PR already has a type:.');
            const nums = new Set();
            for (const m of (pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi)) nums.add(Number(m[1]));
            const rama = pr.head.ref.match(/^[a-z]+\/(\d+)-/);
            if (rama) nums.add(Number(rama[1]));
            for (const n of nums) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n }));
              } catch { continue; }
              if (issue.pull_request) continue;
              const nombres = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
              const tipo = nombres.find(l => l.startsWith('type:'));
              if (!tipo) continue;
              const copiar = [tipo, ...(tiene('area:') ? [] : nombres.filter(l => l.startsWith('area:')))];
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: copiar });
              core.notice(`Copied from issue #${n}: ${copiar.join(', ')}`);
              return;
            }
            core.info('I did not find an issue with type: (Closes #n or the number in the branch).');

  labels:
    needs: [labeler]
    # always(): corre aunque labeler se haya salteado (labeled/unlabeled/edited).
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            const names = pr.labels.map(l => l.name);
            const count = p => names.filter(n => n.startsWith(p)).length;
            const errors = [];
            if (count('type:') !== 1)    errors.push(`type: there must be exactly 1 (there are ${count('type:')}). claude/, cursor/ and release/ branches carry it by hand.`);
            if (count('priority:') > 0) errors.push('priority: is not used on PRs (only on issues).');
            if (count('status:') > 1)    errors.push(`status: at most 1 (there are ${count('status:')}).`);
            if (count('area:') === 0)    core.warning('No area: detected. If the PR touches the product, set it by hand.');
            if (count('area:') > 2)      core.warning(`${count('area:')} area: labels (the convention asks for 1–2). Check whether the PR should be split.`);
            if (names.includes('business-logic')) {
              core.notice('business-logic: requires review by the whole team and the "Lógica de negocio afectada" section filled in.');
              // If it changes a defined rule, the ADR that defines it is amended in the same PR.
              // Explicit exception: an "ADR sin cambios: <motivo>" line in the body.
              const archivos = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
              });
              const tocaAdr = archivos.some(f => f.filename.startsWith('docs/decisions/'));
              const explica = /ADR sin cambios:\s*\S/i.test(pr.body || '');
              if (!tocaAdr && !explica) errors.push('business-logic without changes in docs/decisions/: amend the ADR that defines the rule, or add "ADR sin cambios: <motivo>" to the body.');
            }
            // Agent branches: what implement-issue asks for in the body, validated here instead of in the skill.
            if (/^claude\//.test(pr.head.ref)) {
              // Without the <!-- … --> comments of the template: they mention "Rojo antes de implementar" and "sin test".
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              // Refs #n, on its own line: the PR is part of the issue but does not close it (a diagnosis,
              // one step of several). A passing "ref #38" in the text does not count.
              const cierra = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#\d+/i;
              const refiere = /^\s*refs?:?\s+#\d+/im;
              if (!cierra.test(body) && !refiere.test(body))
                errors.push('the body neither closes nor references any issue: add "Closes #<n>" (or "Refs #<n>" if it does not close it).');
              if (!/<summary>Rojo antes de implementar<\/summary>|sin tests?\b[^\S\n]*:?[^\S\n]*\n?[^\S\n]*\S/i.test(body))
                errors.push('the "Rojo antes de implementar" block from red.sh is missing in "Cómo probarlo" (or "sin test" with the reason).');
            }
            if (errors.length) core.setFailed('PR out of convention:\n- ' + errors.join('\n- '));
            else core.info('PR OK. Labels: ' + names.join(', '));
