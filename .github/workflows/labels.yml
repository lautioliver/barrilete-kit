# .github/workflows/labels.yml — <PROJECT>
# 1) sync:    applies .github/labels.yml to the repo (deletes labels that are not in the file;
#             `aliases` rename the old labels and keep the ones already set on issues).
# 2) labeler: labels PRs according to branch and files (.github/labeler.yml).
# 3) check:   validates the PR labels against docs/github-naming-convention.md §5 and, on agent
#             branches (claude/…), that the body closes or references an issue (Refs #n, for a PR
#             that does not close it, like a diagnosis) and shows the red of the tests.
name: Labels

on:
  push:
    # main: for the template itself. The init leaves it as [<BASE_BRANCH>].
    branches: [main, <BASE_BRANCH>]
    paths: ['.github/labels.yml']
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

jobs:
  sync:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2   # a runaway job (a hostile PR body) must not hold a runner for the 6-hour default
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true   # deletes bug, enhancement, etc. (convention §5)

  labeler:
    if: github.event_name == 'pull_request_target' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 2   # a runaway job (a hostile PR body) must not hold a runner for the 6-hour default
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # It does not check out the PR code: safe with pull_request_target.
      # The config is read from the base branch, so changes to labeler.yml apply after the merge.
      - uses: actions/labeler@v5
        with:
          sync-labels: false   # does not remove labels set by hand (type:audit, business-logic, etc.)
      # Agent branches (claude/…) do not say the type: it is copied from the issue the PR closes.
      # It came out of /improve-skills in a real repo: agent branches arrived without a type and the check failed.
      - name: Copy type and area from the issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: actual } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo, issue_number: pr.number,
            });
            const tiene = p => actual.some(l => l.name.startsWith(p));
            if (tiene('type:')) return core.info('The PR already has a type:.');
            const nums = new Set();
            for (const m of (pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi)) nums.add(Number(m[1]));
            const rama = pr.head.ref.match(/^[a-z]+\/(\d+)-/);
            if (rama) nums.add(Number(rama[1]));
            for (const n of nums) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n }));
              } catch { continue; }
              if (issue.pull_request) continue;
              const nombres = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
              const tipo = nombres.find(l => l.startsWith('type:'));
              if (!tipo) continue;
              const copiar = [tipo, ...(tiene('area:') ? [] : nombres.filter(l => l.startsWith('area:')))];
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: copiar });
              core.notice(`Copied from issue #${n}: ${copiar.join(', ')}`);
              return;
            }
            core.info('I did not find an issue with type: (Closes #n or the number in the branch).');

  labels:
    needs: [labeler]
    # always(): runs even if labeler was skipped (labeled/unlabeled/edited).
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2   # a runaway job (a hostile PR body) must not hold a runner for the 6-hour default
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            const names = pr.labels.map(l => l.name);
            const count = p => names.filter(n => n.startsWith(p)).length;
            const errors = [];
            // Text helpers for the body checks. The author controls the body, so none of the regexes here has two quantifiers that can
            // split the same run of characters (a hostile body must not make the job run for minutes): the body is cut into lines and
            // each marker is read with one simple regex per line.
            const sinComentarios = t => {
              let out = '', i = 0;
              for (;;) {
                const a = t.indexOf('<!--', i), b = a < 0 ? -1 : t.indexOf('-->', a + 4);
                if (b < 0) return out + t.slice(i);
                out += t.slice(i, a); i = b + 3;
              }
            };
            const lineas = t => t.split('\n').map(l => l.replace(/\r$/, ''));
            // A reason is real if a letter or a digit is left once the wrappers (quotes, backticks, * and _) and the <placeholders> are gone.
            const motivoReal = t => /[\p{L}\p{N}]/u.test(t.replace(/[`"'*_]/g, '').replace(/<[^<>]*>/g, ''));
            // Looks for `marcador` line by line. ok: some line has a real reason (on its line or, if `enSiguiente` says so, on the next one).
            // placeholder: a marker was found whose reason was only <…>.
            const hayMotivo = (texto, marcador, enSiguiente) => {
              const ls = lineas(texto);
              let placeholder = false;
              for (let i = 0; i < ls.length; i++) {
                const m = marcador.exec(ls[i]);
                if (!m) continue;
                if (motivoReal(m[1])) return { ok: true, placeholder };
                if (/<[^<>]*>/.test(m[1])) placeholder = true;
                if (i + 1 < ls.length && motivoReal(ls[i + 1]) && enSiguiente(m[1], ls[i + 1])) return { ok: true, placeholder };
              }
              return { ok: false, placeholder };
            };
            // The structured red block of red.sh (ADR-002 D7/D9): the title, `red commit:` once (a hex sha) and, per group, `stack:`, `format:`
            // (junit or tap) and under `failing cases:` at least one `- <file>::<name>`. Linear time like the helpers above: the lines are read
            // with string methods (no regex over the body), and the only regexes run on one trimmed line with a single quantifier.
            const TITULO_ROJO = /<summary>(?:Red before implementing|Rojo antes de implementar)<\/summary>/i;
            const leerBloqueRojo = t => {
              const ls = lineas(t);
              const i = ls.findIndex(l => TITULO_ROJO.test(l));
              if (i < 0) return { found: false, errors: [] };
              const errs = new Set();
              let commits = 0, grupo = null, n = 0;
              const cerrar = () => {
                if (!grupo) return;
                if (!grupo.nombre) errs.add(`group ${n}: "stack:" has no name.`);
                if (grupo.formato !== 'junit' && grupo.formato !== 'tap') errs.add(`group ${n}: "format:" is missing or is not junit or tap.`);
                if (!grupo.cabecera) errs.add(`group ${n}: the "failing cases:" line is missing.`);
                else if (grupo.casos === 0) errs.add(`group ${n}: "failing cases:" needs at least one line "- <file>::<name>".`);
              };
              for (let j = ls[i].includes('</details>') ? ls.length : i + 1; j < ls.length; j++) {
                const l = ls[j].trim(), low = l.toLowerCase();
                if (l.includes('</details>')) break;
                if (low.startsWith('red commit:')) {
                  commits++;
                  if (!/^[0-9a-f]{7,64}$/i.test(l.slice(11).trim())) errs.add('"red commit:" needs a hexadecimal sha (7 to 64 characters).');
                } else if (low.startsWith('stack:')) {
                  cerrar(); n++;
                  grupo = { nombre: l.slice(6).trim(), formato: null, cabecera: false, casos: 0 };
                } else if (low.startsWith('format:')) {
                  if (!grupo) errs.add('"format:" comes before any "stack:".');
                  else grupo.formato = l.slice(7).trim().toLowerCase();
                } else if (low.startsWith('failing cases:')) {
                  if (grupo) grupo.cabecera = true;
                } else if (l.startsWith('- ') && grupo && grupo.cabecera) {
                  const resto = l.slice(2), k = resto.indexOf('::');
                  if (k > 0 && resto.slice(0, k).trim() && resto.slice(k + 2).trim()) grupo.casos++;
                  else errs.add(`group ${n}: a failing case has to be written "- <file>::<name>".`);
                }
              }
              cerrar();
              if (commits !== 1) errs.add(commits === 0 ? 'the "red commit: <sha>" line is missing.' : `"red commit:" must appear once (it appears ${commits} times).`);
              if (n === 0) errs.add('no group: add "stack:", "format:" and "failing cases:" with at least one "- <file>::<name>".');
              return { found: true, errors: [...errs] };
            };
            if (count('type:') !== 1)    errors.push(`type: there must be exactly 1 (there are ${count('type:')}). claude/, cursor/ and release/ branches carry it by hand.`);
            if (count('priority:') > 0) errors.push('priority: is not used on PRs (only on issues).');
            if (count('status:') > 1)    errors.push(`status: at most 1 (there are ${count('status:')}).`);
            if (count('area:') === 0)    core.warning('No area: detected. If the PR touches the product, set it by hand.');
            if (count('area:') > 2)      core.warning(`${count('area:')} area: labels (the convention asks for 1–2). Check whether the PR should be split.`);
            if (names.includes('business-logic')) {
              core.notice('business-logic: requires review by the whole team and the "Business logic affected" section filled in.');
              // If it changes a defined rule, the ADR that defines it is amended in the same PR.
              // Explicit exception: an "ADR unchanged: <reason>" line in the body ("ADR sin cambios:" is the
              // old Spanish literal, still accepted so open PRs and projects in Spanish do not break).
              const archivos = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
              });
              const tocaAdr = archivos.some(f => f.filename.startsWith('docs/decisions/'));
              // The body without the <!-- … --> comments, which GitHub does not show (an exception written inside one does not count).
              const cuerpo = sinComentarios(pr.body || '');
              // The reason on the same line (or, after a bold `**ADR unchanged:**`, on the next one, if it is not a heading):
              // a blank line followed by the next heading is not a reason. A reason that is only <…> is not one either.
              const adr = hayMotivo(cuerpo, /ADR (?:unchanged|sin cambios):([^\n]*)$/i,
                (resto, sig) => /^[\s`"'*_]*$/.test(resto) && /[`"'*_]/.test(resto) && !sig.trimStart().startsWith('#'));
              if (!tocaAdr && !adr.ok) errors.push(adr.placeholder
                ? 'business-logic: the reason of "ADR unchanged:" is still the <reason> placeholder (or "<motivo>"): write why the ADR does not change.'
                : 'business-logic without changes in docs/decisions/: amend the ADR that defines the rule, or add "ADR unchanged: <reason>" to the body.');
            }
            // Agent branches: what implement-issue asks for in the body, validated here instead of in the skill.
            if (/^claude\//.test(pr.head.ref)) {
              // Without the <!-- … --> comments of the template: they mention "Red before implementing" and "no tests".
              const body = sinComentarios(pr.body || '');
              // Refs #n, on its own line: the PR is part of the issue but does not close it (a diagnosis,
              // one step of several). A passing "ref #38" in the text does not count.
              const cierra = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#\d+/i;
              const refiere = /^[^\S\n]*refs?:?\s+#\d+/im;
              if (!cierra.test(body) && !refiere.test(body))
                errors.push('the body neither closes nor references any issue: add "Closes #<n>" (or "Refs #<n>" if it does not close it).');
              // The English literals are the current ones; the Spanish ones ("Rojo antes de implementar", "sin tests:")
              // stay as aliases. "no tests"/"sin tests" need the colon and a reason (on the same line or the next one): without it,
              // any "there is no test coverage" would pass. A reason that is only <…> (the placeholder copied as is) does not count.
              const sinTests = hayMotivo(body, /(?:^|[^A-Za-z0-9])(?:no|sin) tests?:([^\n]*)$/i, () => true);
              // A block with the title is judged by its structure, whatever else the body says: a malformed block is not a red, and
              // a "no tests:" line cannot hide it (a PR may carry a block for what is tested and "no tests:" for what is not).
              // "no tests: <reason>" stands in for the block only when there is no block.
              const rojo = leerBloqueRojo(body);
              if (rojo.found) rojo.errors.forEach(e => errors.push('the "Red before implementing" block from red.sh is incomplete: ' + e));
              else if (!sinTests.ok) errors.push(sinTests.placeholder
                ? 'the reason of "no tests:" is still the <reason> placeholder (or "<motivo>"): write why there are no tests.'
                : 'the "Red before implementing" block from red.sh is missing in "How to test it" (or "no tests: <reason>").');
            }
            if (errors.length) core.setFailed('PR out of convention:\n- ' + errors.join('\n- '));
            else core.info('PR OK. Labels: ' + names.join(', '));
