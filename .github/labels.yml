# .github/labels.yml — <PROJECT>
# Source of truth for the repo labels. See docs/github-naming-convention.md §5
# Format compatible with EndBug/label-sync and crazy-max/ghaction-github-labeler.
# The Spanish descriptions live in labels.es.yml (the init picks one, ADR-001).

# ── type: ────────────────────────────────────────────
- name: "type:feature"
  color: "7B61FF"
  description: "New functionality or a change in visible behavior"
  aliases:
    - "tipo:feature"
- name: "type:bug"
  color: "7B61FF"
  description: "Something does not work as defined"
  aliases:
    - "tipo:bug"
- name: "type:task"
  color: "7B61FF"
  description: "Technical work with no visible change"
  aliases:
    - "tipo:task"
- name: "type:audit"
  color: "7B61FF"
  description: "Finding that came out of an audit"
  aliases:
    - "tipo:audit"
- name: "type:docs"
  color: "7B61FF"
  description: "Documentation"
  aliases:
    - "tipo:docs"

# ── area: ────────────────────────────────────────────
# TODO: one per product area; same names as the commit scopes (§2).
# The three below always exist: labeler.yml uses them.
- name: "area:api"
  color: "1D76DB"
  description: "API and business logic"
- name: "area:infra"
  color: "1D76DB"
  description: "Deploy, database, CI/CD"
- name: "area:docs"
  color: "1D76DB"
  description: "Documentation, ADRs and rules for agents"

# ── priority: ───────────────────────────────────────
- name: "priority:critical"
  color: "B60205"
  description: "Breaks production or affects money/tickets"
  aliases:
    - "prioridad:critica"
- name: "priority:high"
  color: "D93F0B"
  description: "Blocks the next milestone"
  aliases:
    - "prioridad:alta"
- name: "priority:medium"
  color: "FBCA04"
  description: "Important but not blocking"
  aliases:
    - "prioridad:media"
- name: "priority:low"
  color: "C5C5C5"
  description: "Nice to have, no date"
  aliases:
    - "prioridad:baja"

# ── status: ───────────────────────────────────────────────────────────────────────────────────
- name: "status:triage"
  color: "FEF2C0"
  description: "Type, area and priority still to be assigned"
  aliases:
    - "estado:a-triar"
- name: "status:needs-info"
  color: "FEF2C0"
  description: "Cannot move forward without more information"
  aliases:
    - "estado:necesita-info"
- name: "status:blocked"
  color: "FEF2C0"
  description: "Depends on another issue or on a third party"
  aliases:
    - "estado:bloqueado"

# ── special ───────────────────────────────────────
- name: "business-logic"
  color: "000000"
  description: "Touches a business rule already defined; needs team review"
  aliases:
    - "logica-negocio"
- name: "breaking-change"
  color: "000000"
  description: "Breaks compatibility"
