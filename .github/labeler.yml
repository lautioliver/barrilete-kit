# .github/labeler.yml — <PROJECT>
# Automatic PR labeling with actions/labeler v5.
# Rule: this file ONLY uses labels that exist in .github/labels.yml. Do not create new labels here.

# ── type: from the branch prefix (Conventional Branch 1.1) ──────────
# No automatic type: claude/, cursor/, release/ and bot branches.
# In those cases it is set by hand; the workflow check warns if it is missing.
"type:feature":
  - head-branch: ['^feat/', '^feature/']

"type:bug":
  - head-branch: ['^fix/', '^bugfix/', '^hotfix/']

"type:task":
  - head-branch: ['^chore/']

"type:docs":
  - head-branch: ['^docs/']

# ── area: from the files the PR touches ──────────────────────────────
# TODO: one entry per area: in labels.yml, with the paths of your repo.

"area:api":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'           # TODO: adjust

"area:infra":
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'infra/**'
          - 'Dockerfile'

"area:docs":
  - changed-files:
      - all-globs-to-all-files:
          - '{docs/**,*.md,llms.txt,.claude/**}'
