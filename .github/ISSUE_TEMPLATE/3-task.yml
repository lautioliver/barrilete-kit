name: Task
description: Technical work with no visible change
labels: ["type:task", "status:triage"]
body:
  - type: textarea
    id: what
    attributes: { label: What needs to be done }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why }
  - type: textarea
    id: criteria
    attributes: { label: Done when, value: "- [ ] " }
