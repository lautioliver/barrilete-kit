name: Feature
description: New functionality or a change in visible behavior
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Title in the imperative, no prefix. E.g.: *Unify accounts by email*."
  - type: textarea
    id: objetivo
    attributes: { label: Goal, description: What has to be achieved and for whom. }
    validations: { required: true }
  - type: textarea
    id: alcance
    attributes: { label: Scope, description: What is in and what is left out. }
  - type: textarea
    id: criterios
    attributes: { label: Acceptance criteria, value: "- [ ] " }
  - type: textarea
    id: negocio
    attributes: { label: Business logic affected, description: "Does it change a rule already defined? ADR or doc." }
