name: Audit finding
description: One issue per finding of an audit
labels: ["type:audit", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Title: `Audit <area>: <finding>`. E.g.: *Audit payments: the webhook is not idempotent*."
  - type: input
    id: documento
    attributes: { label: Audit document, description: Link to the file in docs/development/ and the finding ID (AUD-01). }
    validations: { required: true }
  - type: textarea
    id: hallazgo
    attributes: { label: Finding, description: What was found and where (files). }
    validations: { required: true }
  - type: textarea
    id: riesgo
    attributes: { label: Risk }
  - type: textarea
    id: propuesta
    attributes: { label: Proposed fix }
