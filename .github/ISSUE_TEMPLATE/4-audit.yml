name: Hallazgo de auditoría
description: Un issue por hallazgo de una auditoría
labels: ["type:audit", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Título: `Auditoría <área>: <hallazgo>`. Ej.: *Auditoría pagos: el webhook no es idempotente*."
  - type: input
    id: documento
    attributes: { label: Documento de auditoría, description: Link al archivo en docs/development/ y el ID del hallazgo (AUD-01). }
    validations: { required: true }
  - type: textarea
    id: hallazgo
    attributes: { label: Hallazgo, description: Qué se encontró y dónde (archivos). }
    validations: { required: true }
  - type: textarea
    id: riesgo
    attributes: { label: Riesgo }
  - type: textarea
    id: propuesta
    attributes: { label: Propuesta de arreglo }
