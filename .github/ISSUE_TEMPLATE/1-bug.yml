name: Bug
description: Something does not work as defined
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Title: the symptom, descriptive. E.g.: *The QR does not validate offline*."
  - type: textarea
    id: que-pasa
    attributes: { label: What happens, description: What you see and where. }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: What should happen, description: With a link to the ADR or doc that defines it, if there is one. }
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes: { label: How to reproduce it }
  - type: textarea
    id: contexto
    attributes: { label: Context, description: Environment, IDs, logs (no secrets or personal data). }
