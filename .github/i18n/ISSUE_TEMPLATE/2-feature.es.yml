name: Feature
description: Funcionalidad nueva o cambio de comportamiento visible
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Título en imperativo, sin prefijo. Ej.: *Unificar cuentas por email*."
  - type: textarea
    id: goal
    attributes: { label: Objetivo, description: Qué hay que lograr y para quién. }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Alcance, description: Qué entra y qué queda afuera. }
  - type: textarea
    id: criteria
    attributes: { label: Criterios de aceptación, value: "- [ ] " }
  - type: textarea
    id: business
    attributes: { label: Lógica de negocio afectada, description: "¿Cambia una regla ya definida? ADR o doc." }
