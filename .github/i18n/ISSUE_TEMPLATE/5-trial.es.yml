name: Reporte de prueba
description: Probaste la plantilla en tu repo y querés contar dónde te trabaste
labels: ["type:task", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Gracias por probarla. La guía está en `docs/try-the-template.es.md`. No pegues secretos ni datos personales."
  - type: dropdown
    id: tool
    attributes:
      label: Herramienta
      options: [Claude Code, Codex, GitHub Copilot, Cursor, Otra]
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Modo
      options: [Completo, Chico, No llegué a inicializar]
    validations: { required: true }
  - type: dropdown
    id: how-far
    attributes:
      label: Hasta dónde llegaste
      description: "El último paso de la guía que terminaste. En modo chico no hay paso 7 (revisión) ni orchestrate: si llegaste al merge, elegí 8."
      options:
        - 1. Crear el repo
        - 2. Inicializar
        - 3. Completar lo mínimo
        - 4. Labels y equipo
        - 5. Un issue desde el chat
        - 6. Del issue al PR
        - 7. Revisión
        - 8. Merge
        - 9. Si te queda tiempo
    validations: { required: true }
  - type: textarea
    id: blockers
    attributes:
      label: Dónde te trabaste
      description: Un ítem por traba, con el paso, qué hiciste y el error textual. Si no te trabaste, poné "ninguna".
      placeholder: "- Paso 3: no encontré dónde van los comandos de test. Error: …"
    validations: { required: true }
  - type: textarea
    id: doubts
    attributes:
      label: Qué leíste dos veces o no entendiste
  - type: textarea
    id: agent
    attributes:
      label: Qué hizo el agente que no esperabas
      description: Se frenó, preguntó de más, se salteó algo, tocó lo que no debía, o lo hiciste vos a mano.
  - type: input
    id: time
    attributes:
      label: Tiempo hasta el primer PR
      placeholder: "por ejemplo: 50 minutos"
  - type: textarea
    id: would-change
    attributes:
      label: ¿La volverías a usar? ¿Qué cambiarías primero?
