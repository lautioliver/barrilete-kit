# Generated by scripts/agents/sync-rules from lautioliver/barrilete-rules@73b5c6ee27b8a3b7de08f1ca5e6542e59049533b (classes.yml, ADR-006 D2).
# Do not edit: change it in barrilete-rules.
# Clases de hallazgo y de desvío (ADR-006 D4 del kit). Fuente única de las clases: este repo (D2).
# Un id estable (`- id: <slug>`, empieza con una letra) y una línea cada una (`  description: <texto plano>`). `deviations` (opcional): los tipos de desvío de `bk learn` que cuentan para la clase
# (ADR-007 D5 del kit); un tipo va en una sola clase, y uno sin clase se guarda pero no se mide.
# Se escribe exactamente `  deviations: [<tipo>, …]` (dos espacios, un espacio después de `:`); un tipo es un slug que empieza con una letra.
# `other` está reservada: no se lista acá, review-pr la usa cuando ninguna clase calza.
# validate.py lee el archivo entero con el criterio del lector del kit: cualquier otra línea que no sea un comentario es un error.
# La copia del kit (docs/agents/classes.yml) la genera `sync-rules` desde este archivo: no se edita allá.
- id: pr-metadata
  description: the PR body, title, number or red block says something that is not true of this PR
- id: ci-claim
  description: it claims something about the CI that the checks do not show (green, flaky, passes)
- id: undecided-decision
  description: the change decides something the issue did not approve (ADR, rule, scope)
  deviations: [attribution]
- id: test-cannot-fail
  description: a test that still passes if what it checks is removed, or a form forbidden in the red
- id: stale-docs
  description: a doc, skill or README still says what the change made false
- id: wrong-command
  description: a command, flag, prefix or path that the real tool does not accept
- id: text-code-mismatch
  description: what the text says and what the code does are not the same thing
- id: uncovered-case
  description: a case that no rule, test or branch covers (it is skipped or ignored)
- id: unhandled-input
  description: a malformed, hostile or edge input that crashes or fails silently
